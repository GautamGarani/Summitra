<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summitra | Biometric Monitor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>

    <style>
        :root {
            /* Rich Blue Monochromatic Spectrum */
            --blue-900: #0D1B2A; /* Deep Navy */
            --blue-700: #1B263B; /* Indigo */
            --blue-500: #415A77; /* Steel Blue */
            --blue-300: #778DA9; /* Slate */
            --blue-primary: #0052CC; /* Azure Radiance */
            --blue-accent: #E1EFFF; /* Sky Tint */
            
            --surface: #F8FAFC;
            --card-bg: #FFFFFF;
            --error-state: #D32F2F;
            --border-soft: #E2E8F0;
        }

        body {
            margin: 0;
            background-color: var(--surface);
            color: var(--blue-900);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 32px;
            gap: 16px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--blue-accent);
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--blue-primary);
        }

        .header-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--blue-500);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 32px;
            padding: 32px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- PREVIEW ARCHITECTURE --- */
        .viewport-container {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 82, 204, 0.05), 
                        0 8px 10px -6px rgba(0, 82, 204, 0.05);
            border: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
        }

        .video-wrapper {
            position: relative;
            flex: 1;
            border-radius: 24px;
            overflow: hidden;
            background: #000;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        /* --- TELEMETRY CARD --- */
        #monitor-card {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .card-segment {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--blue-300);
            letter-spacing: 0.05em;
            margin-bottom: 12px;
            display: block;
        }

        #feedback-value {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.1;
            color: var(--blue-900);
            transition: color 0.2s ease;
        }

        #raw-angle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--blue-500);
            background: var(--blue-accent);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 16px;
        }

        .log-container {
            background: var(--blue-900);
            color: #FFF;
            border-radius: 16px;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: auto;
        }

        /* --- ANIMATIONS & INDICATORS --- */
        .pulse {
            width: 10px; height: 10px; border-radius: 50%;
            background: #3a4759;
        }

        .active-pulse {
            background-color: #4ADE80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.2);
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        @media (max-width: 1024px) {
            main { grid-template-columns: 1fr; overflow-y: auto; }
            header { padding: 0 20px; }
        }
    </style>
</head>
<body>

<header>
    <div style="background: var(--blue-accent); color: var(--blue-primary); padding: 8px; border-radius: 12px;">
        <span class="material-symbols-rounded" style="font-size: 28px;">clinical_notes</span>
    </div>
    <div>
        <div class="header-title">Summitra</div>
        <div class="header-subtitle">Advanced Postural Analytics</div>
    </div>
</header>

<main>
    <section class="viewport-container">
        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <div style="padding: 16px 8px 4px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 11px; color: var(--blue-300); font-weight: 600;">STREAM_SOURCE: WEBCAM_01</span>
            <span style="font-size: 11px; color: var(--blue-300); font-weight: 600;">LATENCY: 250MS</span>
        </div>
    </section>

    <section id="monitor-card">
        <div class="card-segment">
            <span class="label">Kinetic Feedback</span>
            <div id="feedback-value">Awaiting Calibration...</div>
            <div id="raw-angle">Tilt Vector: --°</div>
        </div>

        <div class="card-segment" style="flex: 1; border-style: dashed; background: transparent;">
            <span class="label">Session Statistics</span>
            <div style="color: var(--blue-300); font-size: 13px;">
                Calculated via Rust-WASM engine at a 4Hz temporal resolution using 30-frame windows.
            </div>
        </div>
        
        <div class="log-container">
            <div id="log-pulse" class="pulse"></div>
            <span id="log-text">Initializing Vision Systems...</span>
        </div>
    </section>
</main>

<script type="module">
    import init, { process_tilt_data } from './pkg/math_engine.js';
    const { FaceLandmarker, FilesetResolver } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3");

    async function startCoach() {
        const display = document.getElementById('feedback-value');
        const rawText = document.getElementById('raw-angle');
        const logText = document.getElementById('log-text');
        const pulse = document.getElementById('log-pulse');
        const video = document.getElementById('webcam');

        try {
            logText.textContent = "Syncing Rust Module...";
            await init(); 

            logText.textContent = "Loading Vision Models...";
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            const landmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1
            });

            logText.textContent = "Accessing Media Stream...";
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            
            await new Promise((resolve) => video.onloadedmetadata = resolve);
            await video.play();

            logText.textContent = "System Active";
            pulse.classList.add('active-pulse');

            setInterval(() => {
                const results = landmarker.detectForVideo(video, performance.now());
                
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const l = results.faceLandmarks[0];
                    const degrees = Math.atan2(l[263].y - l[33].y, l[263].x - l[33].x) * (180 / Math.PI);
                    const feedback = process_tilt_data(degrees);

                    display.innerHTML = feedback;
                    rawText.innerHTML = `Lateral Tilt: ${degrees.toFixed(2)}°`;
                    display.style.color = feedback.includes("Lean") ? "var(--error-state)" : "var(--blue-primary)";
                } else {
                    display.innerHTML = "Subject Not Found";
                    display.style.color = "var(--blue-300)";
                }
            }, 250);

        } catch (error) {
            logText.textContent = "Initialization Failed";
            logText.style.color = "#FF8A8A";
            console.error(error);
        }
    }

    // ---------- AUDIO SYSTEM (integrated fix) ----------
    let audioCtx = null;
    let audioUnlocked = false;

    function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

        audioUnlocked = true;
    }

    // Required user interaction
    document.addEventListener("click", unlockAudio, { once: true });

    // 🔴 Alert sound (bad posture)
    window.play_alert = function () {
        if (!audioUnlocked) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "square";
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
    };

    // 🟢 Success sound (recovered posture)
    window.play_success = function () {
        if (!audioUnlocked) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.18);
    };

    startCoach();
</script>

</body>
</html>
