<head>
<title>Analytics</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

<link href="styles.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* only analytics-specific layout using your existing design language */

body{
overflow:auto;
}

main{
max-width:900px;
margin:auto;
padding:32px;
display:flex;
flex-direction:column;
gap:28px;
}

.analytics-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:28px;
}

.stats{
background:var(--blue-accent);
}

.stat{
font-size:22px;
font-weight:700;
color:var(--blue-900);
margin-top:12px;
}

.chart-container{
width:100%;
height:340px;
position:relative;
}

.back-btn{
background:var(--blue-primary);
color:#fff;
border:none;
padding:18px 32px;
border-radius:18px;
font-weight:700;
font-size:16px;
cursor:pointer;
box-shadow:0 10px 15px -3px rgba(0,82,204,.2);
transition:.2s;
}

.back-btn:hover{
transform:translateY(-2px);
filter:brightness(1.08);
}
</style>
</head>

<body>

<header>
<div class="icon-box" style="width:48px;height:48px;border-radius:12px;margin:0;">
<span class="material-symbols-rounded">analytics</span>
</div>

<div>
<div class="header-title">Summitra</div>
<div class="header-subtitle">Session Analytics</div>
</div>
</header>

<main>

<h2>Session Analytics</h2>

<div class="analytics-grid">

<div class="card stats">
<h3>Current Session</h3>

<div class="stat">
⭐ Avg Score:
<span id="curr-score">0</span>
</div>
</div>


<div class="card stats">
<h3>Previous Session</h3>

<div class="stat">
⭐ Avg Score:
<span id="prev-score">0</span>
</div>
</div>

</div>


<div class="card">
<h3>Posture Alert Distribution</h3>

<div class="chart-container">
<canvas id="chart"></canvas>
</div>
</div>

<button class="back-btn" onclick="goBack()">
Back to Dashboard
</button>

</main>

<script>
function goBack() {
    window.location.href = "dashboard.html";
}

function pct(session){
    if (!session || !session.totalFrames) return 0;

    return (
      session.goodFrames /
      session.totalFrames * 100
    ).toFixed(1);
}

function loadAnalytics(){

    const sessions =
        JSON.parse(
            localStorage.getItem("sessions")
        ) || [];

    if (!sessions.length){
        alert("No sessions found");
        return;
    }

    const current = sessions.at(-1);
    const previous = sessions.at(-2) || null;

    // ---------------- COMPLIANCE STATS ----------------

    document.getElementById("curr-score")
        .textContent = pct(current) + "%";

    document.getElementById("prev-score")
        .textContent = previous
            ? pct(previous) + "%"
            : "N/A";


    // bad posture frames
    const currentBad =
        current.badFrames || 0;

    const previousBad =
        previous
          ? previous.badFrames || 0
          : 0;


    // ---------------- PIE CHART ----------------

    new Chart(
      document.getElementById("chart"),
      {
        type:"pie",

        data:{
          labels:[
            "Lateral",
            "Forward",
            "Slouch"
            ],

          datasets:[{
            data:[
        current.lateralAlerts,
        current.forwardAlerts,
        current.slouchAlerts
        ],

            backgroundColor:[
              "#3b82f6",
              "#ef4444",
              "#f59e0b"
            ]
          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false
        }
      }
    );

}

loadAnalytics();
</script>

</body>
</html>
