<!DOCTYPE html>
<html lang="en">

<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function () {
            const currentUserId = localStorage.getItem('currentUserId');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser');

            if (isLoggedIn == 'true' && currentUserId) {
                window.location.href = 'dashboard.html';
            }
        })();


    </script>
    <script src="connectivity.js"></script>
    <link rel="icon" type="image/png" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summitra | Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
        <style>
        /* --- KINETIC UI OVERRIDES --- */
        body {
            overflow-x: hidden;
            background-color: var(--surface);
        }

        .entrance-container {
            perspective: 2000px;
            padding-bottom: 100px;
        }

        .swirl-in {
            opacity: 0;
            transform-origin: center center;
            animation: entranceSwirl 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes entranceSwirl {
            0% {
                opacity: 0;
                transform: rotateX(-20deg) rotateY(15deg) scale(0.9) translateY(60px);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: rotateX(0deg) rotateY(0deg) scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .fancy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-soft);
        }

        .header-title {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--blue-900);
            letter-spacing: -0.5px;
        }

        /* Hero Section */
        .policy-hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
            padding: 80px 4rem !important;
        }

        .hero-stock-img {
            width: 100%;
            border-radius: 32px;
            transform: perspective(1000px) rotateY(-15deg) rotateX(5deg);
            box-shadow: -30px 30px 60px rgba(13, 27, 42, 0.15);
            transition: transform 0.6s ease;
        }

        .hero-stock-img:hover {
            transform: perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1.02);
        }

        /* Feature Grid Adjustments */
        .feature-grid {
            padding: 0 4rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .zoom-hover-card {
            display: flex;
            flex-direction: column;
            padding: 3rem;
            border-radius: 32px;
            background: white;
            border: 1px solid var(--border-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
        }

        .zoom-hover-card:hover {
            transform: scale(1.02) translateY(-10px);
            box-shadow: 0 40px 80px rgba(13, 27, 42, 0.08);
            border-color: var(--blue-primary);
        }

        .feature-badge {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            background: var(--blue-accent);
            color: var(--blue-primary);
        }

        .feature-points {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-points div {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--blue-700);
        }

        .feature-points div::before {
            content: "check_circle";
            font-family: 'Material Symbols Rounded';
            color: var(--success);
            font-size: 20px;
        }

        .btn-container {
            margin-top: 4rem;
            text-align: center;
        }
    </style>
</head>

<body class = "login-redesign">

    <header class="fancy-header">
        <div class="header-content">
            <img src="logo.jpg" class="logo-watermark" alt="Summitra Logo">
            <div class="header-text-group">
                <div class="header-title">Summitra</div>
                <div class="header-subtitle">Reaching the Epitome of wellness</div>
            </div>
        </div>
    </header>

    <main class="dashboard-main-pro"
        style="justify-content: center; align-items: center; min-height: calc(100vh - 72px);">


        <div class="card feature-card" style="max-width: 420px; width: 100%;">
            <h2>Login</h2>
            <div class="input-group">
                <input id="username" type="text" placeholder=" " required>
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input id="password" type="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            <button class="btn" onclick="attemptLogin()">Login</button>
        </div>


    </main>
    <script src="auth.js"></script>
</body>

</html>
