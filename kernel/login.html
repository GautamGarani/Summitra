<!DOCTYPE html>
<html lang="en">

<head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script>redirectIfAuthenticated();</script>
    <script src="connectivity.js"></script>
    <link rel="icon" type="image/png" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summitra | Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        /* Immersive Splash Screen Styles */
        .splash-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            /* Updated to blue, slate, and black palette */
            background: linear-gradient(-45deg, #030712, #0F172A, #1E3A8A, #1E40AF, #0284C7, #030712);
            background-size: 400% 400%;
            animation: gradientSwirl 12s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }

        @keyframes gradientSwirl {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .splash-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .splash-content {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .splash-slide {
            position: absolute;
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            color: white;
            width: 100%;
        }

        .splash-slide.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .splash-slide.exit {
            opacity: 0;
            transform: translateY(-40px) scale(1.05);
        }

        .splash-slide h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
            line-height: 1.1;
        }

        .splash-slide p {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 300;
            line-height: 1.6;
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .splash-slide .icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: #FFFFFF;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        .enter-btn-container {
            position: absolute;
            bottom: 60px;
            z-index: 10;
        }

        .enter-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 18px 48px;
            border-radius: 99px;
            font-size: 1.2rem;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .enter-btn:hover {
            background: #FFFFFF;
            color: #0F172A;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        
        .enter-btn:active {
            transform: scale(0.98);
        }

        .about-banner {
            width: 100%;
            max-width: 420px;
            /* Updated to match splash overlay color profile */
            background: linear-gradient(-45deg, #030712, #0F172A, #1E3A8A, #1E40AF, #0284C7, #030712);
            background-size: 400% 400%;
            animation: gradientSwirl 12s ease infinite;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(3, 7, 18, 0.3);
            text-align: left;
            min-height: 100px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .about-banner .banner-icon {
            font-size: 2.2rem;
            color: white;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .about-banner .banner-content {
            flex: 1;
        }

        .banner-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 800;
            margin-bottom: 6px;
        }

        .banner-typewriter {
            font-size: 0.95rem;
            font-weight: 400;
            color: white;
            line-height: 1.5;
            display: inline;
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }
        
        .banner-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1rem;
            background-color: white;
            animation: blinkCursor 0.8s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

<body class="login-redesign">
    <!-- Splash Screen Overlay -->
    <div id="summitra-splash" class="splash-overlay">
        <div class="splash-content" id="splash-content"></div>
        <div class="enter-btn-container">
            <button class="enter-btn" onclick="closeSplash()">
                ENTER SUMMITRA <span class="material-symbols-rounded">arrow_forward</span>
            </button>
        </div>
    </div>
    <header class="fancy-header">
        <div class="header-content">
            <img src="logo.jpg" class="logo-watermark" alt="Summitra Logo">
            <div class="header-text-group">
                <div class="header-title">Summitra</div>
                <div class="header-subtitle">Reaching the Epitome of wellness</div>
            </div>
        </div>

        <div class="header-actions">

            <button class="secondary-btn logout-pill" onclick="location.href='signUp.html'">
                <span class="material-symbols-rounded">person</span>Sign Up
            </button>
            <button class="secondary-btn logout-pill" onclick="window.open('about.html', '_blank')">
                <span class="material-symbols-rounded">info</span>

            </button>
            <button class="secondary-btn logout-pill" onclick="window.open('privacyPolicy.html', '_blank')">
                <span class="material-symbols-rounded">shield</span>

            </button>
        </div>
    </header>

    <main class="dashboard-main-pro"
        style="justify-content: center; align-items: center; min-height: calc(100vh - 72px);">

        <div class="about-banner">
            <div class="material-symbols-rounded banner-icon" id="banner-icon">neurology</div>
            <div class="banner-content">
                <div class="banner-title" id="banner-title">About Summitra</div>
                <div class="banner-typewriter" id="banner-text-container"></div>
                <span class="banner-cursor"></span>
            </div>
        </div>

        <div class="card feature-card" style="max-width: 420px; width: 100%;">
            <h2>Login</h2>
            <div class="input-group">
                <input id="email" type="email" placeholder=" " required autocomplete="username">
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <input id="password" type="password" placeholder=" " required autocomplete="current-password">
                <label for="password">Password</label>
            </div>
            <button class="btn" onclick="attemptLogin()">Login</button>
            <hr>
            <button class="secondary-btn" onclick="location.href='signUp.html'">Don't have an account or invite?</button>
            <button class="secondary-btn" style="margin-top: 10px; border-color: var(--action-accent); color: var(--action-accent);" onclick="playSplash()">
                <span class="material-symbols-rounded">help</span> What is Summitra?
            </button>
        </div>

    </main>

    <script>
        const splashSlides = [
            { icon: 'neurology', title: 'Welcome to Summitra', text: 'Your kinetic health and posture intelligence companion.' },
            { icon: 'sensors', title: 'Live Vision Engine', text: 'Sit back and let our AI monitor your posture in real-time, sending gentle alerts before ergonomic debt builds.' },
            { icon: 'insights', title: 'Deep Analytics', text: 'Review your session compliance, analyze fatigue trends, and track your posture resilience.' },
            { icon: 'chat', title: 'Mitraa AI', text: 'Consult with your personal kinetic health assistant for tailored ergonomic guidance and setup reviews.' },
            { icon: 'task_alt', title: 'Ready to Align?', text: 'Enter the app, calibrate your posture, and reach the epitome of wellness.' }
        ];

        let currentSlideIdx = 0;
        let slideInterval;

        function renderSlide(index) {
            const container = document.getElementById('splash-content');
            
            const activeSlide = container.querySelector('.splash-slide.active');
            if (activeSlide) {
                activeSlide.classList.remove('active');
                activeSlide.classList.add('exit');
                setTimeout(() => activeSlide.remove(), 800);
            }
            
            if (index >= splashSlides.length) {
                currentSlideIdx = 0;
            }
            const data = splashSlides[currentSlideIdx];
            
            const slide = document.createElement('div');
            slide.className = 'splash-slide';
            slide.innerHTML = `
                <div class="material-symbols-rounded icon">${data.icon}</div>
                <h1>${data.title}</h1>
                <p>${data.text}</p>
            `;
            
            container.appendChild(slide);
            
            setTimeout(() => {
                slide.classList.add('active');
            }, 50);
        }

        function playSplash() {
            const splash = document.getElementById('summitra-splash');
            splash.classList.add('active');
            
            currentSlideIdx = 0;
            document.getElementById('splash-content').innerHTML = '';
            renderSlide(currentSlideIdx);
            
            clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                currentSlideIdx++;
                if(currentSlideIdx >= splashSlides.length) currentSlideIdx = 0;
                renderSlide(currentSlideIdx);
            }, 4500); 
        }

        function closeSplash() {
            document.getElementById('summitra-splash').classList.remove('active');
            localStorage.setItem('hasSeenSplash', 'true');
            clearInterval(slideInterval);
        }

        // Typewriter Animation Logic for About Banner
        let bannerMsgIndex = 0;
        let bannerCharIndex = 0;
        let isDeleting = false;

        function runTypewriter() {
            const currentItem = splashSlides[bannerMsgIndex];
            const textContainer = document.getElementById('banner-text-container');
            const iconContainer = document.getElementById('banner-icon');
            const titleContainer = document.getElementById('banner-title');

            if (iconContainer) iconContainer.textContent = currentItem.icon;
            if (titleContainer) titleContainer.textContent = currentItem.title;

            const fullText = currentItem.text;

            if (isDeleting) {
                textContainer.textContent = fullText.substring(0, bannerCharIndex - 1);
                bannerCharIndex--;
            } else {
                textContainer.textContent = fullText.substring(0, bannerCharIndex + 1);
                bannerCharIndex++;
            }

            let typeSpeed = isDeleting ? 30 : 60;

            if (!isDeleting && bannerCharIndex === fullText.length) {
                typeSpeed = 2500;
                isDeleting = true;
            } else if (isDeleting && bannerCharIndex === 0) {
                isDeleting = false;
                bannerMsgIndex = (bannerMsgIndex + 1) % splashSlides.length;
                typeSpeed = 500;
            }

            setTimeout(runTypewriter, typeSpeed);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('hasSeenSplash')) {
                setTimeout(playSplash, 500);
            }
            runTypewriter();
        });
    </script>
</body>
</html>
