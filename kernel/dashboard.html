<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summitra | Wellness Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">

    <!-- Chart.js -->
    <!--<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>-->

    <style>
        #chart-container {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <div class="icon-box" style="width: 48px; height: 48px; border-radius: 12px; margin: 0;">
        <span class="material-symbols-rounded">clinical_notes</span>
    </div>
    <div>
        <div class="header-title">Summitra</div>
        <div class="header-subtitle">Reaching the epitome of wellness</div>
    </div>
</header>

<main>

    <!-- EXISTING CARD -->
    <div class="card">
        <div class="icon-box">
            <span class="material-symbols-rounded" style="font-size: 40px;">monitoring</span>
        </div>
        <h2>Start Monitoring</h2>
        <p>Launch the Vision Engine to begin real-time posture tracking.</p>
        <button class="btn" onclick="location.href='live.html'">
            Launch Live Monitor
            <span class="material-symbols-rounded">arrow_forward</span>
        </button>
    </div>

    <!-- ANALYTICS CARD -->
    <div class="card">
        <div class="icon-box">
            <span class="material-symbols-rounded" style="font-size: 40px;">pie_chart</span>
        </div>
        <h2>View Analytics</h2>
        <p>Compare your last two sessions.</p>

        <button id="view-analytics-btn" onclick="location.href='analytics.html'">
        View Analytics
        <span class="material-symbols-rounded">analytics</span>
        </button>

        <!--<div id="chart-container">
            <canvas id="pieChart"></canvas>
        </div>-->
    </div>

</main>
