<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="connectivity.js"></script>
    <script>requireAuth();</script>
    <link rel="icon" type="image/png" href="logo.jpg">
    <title>Mitraa AI Chat | Summitra</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            overflow-x: hidden;
            background-color: var(--surface);
        }

        .chat-layout {
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
        }

        .chat-container {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .chat-header-section {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            gap: 16px;
            background: #FAFBFC;
        }

        .chat-header-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-header-info h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--blue-900);
        }

        .chat-header-info p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: var(--blue-500);
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 14px 20px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.bot {
            align-self: flex-start;
            background: #F1F5F9;
            color: var(--blue-900);
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--blue-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot pre {
            background: #E2E8F0;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .message.bot code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .message.bot p {
            margin: 0 0 10px 0;
        }

        .message.bot p:last-child {
            margin-bottom: 0;
        }

        .message.bot ul, .message.bot ol {
            margin: 5px 0;
            padding-left: 20px;
        }

        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-soft);
            background: #FAFBFC;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border-soft);
            border-radius: 16px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        .chat-input:focus {
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 4px var(--blue-accent);
        }

        .chat-send-btn {
            background: var(--blue-primary);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(30, 110, 67, 0.25);
        }

        .chat-send-btn:disabled {
            background: var(--blue-300);
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .typing-indicator {
            align-self: flex-start;
            background: #F1F5F9;
            padding: 14px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--blue-500);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Bot Splash Overlay Styles */
#bot-welcome-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(13, 27, 42, 0.4);
    backdrop-filter: blur(8px);
    pointer-events: auto;
    animation: fadeOutOverlay 0.6s ease forwards 3.8s;
}

/* Background Color Splash */
.splash-burst {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--blue-primary) 0%, var(--blue-500) 40%, var(--blue-accent) 70%, transparent 100%);
    animation: splashExpand 1s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
}

/* Bot Container & Zoom Animation */
.bot-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transform: scale(0);
    animation: botZoomIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.4s;
}

.bot-avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--blue-primary);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0, 82, 204, 0.4);
    border: 3px solid var(--blue-accent);
}

.bot-avatar .material-symbols-rounded {
    font-size: 3rem;
}

/* Speech Bubble Animation */
.speech-bubble {
    background: var(--card-bg);
    color: var(--blue-900);
    padding: 14px 24px;
    border-radius: 18px;
    font-weight: 600;
    font-size: 1.1rem;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    border: 1px solid var(--border-soft);
    opacity: 0;
    transform: translateY(10px);
    animation: bubblePop 0.5s ease forwards 1.1s;
}

/* Keyframes */
@keyframes splashExpand {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(250); opacity: 0; }
}

@keyframes botZoomIn {
    0% { transform: scale(0) rotate(-15deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes bubblePop {
    0% { transform: translateY(10px) scale(0.9); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes fadeOutOverlay {
    to { opacity: 0; visibility: hidden; pointer-events: none; }
}
    </style>
</head>

<body>
    <div id="bot-welcome-overlay">
    <div class="splash-burst"></div>
    <div class="bot-container">
        <div class="bot-avatar">
            <img src="logo.jpg" class="logo-watermark" alt="Summitra">
        </div>
        <div class="speech-bubble">
            Welcome! Ready to analyse your posture?
        </div>
    </div>
</div>
    <header class="fancy-header">
        <div class="header-content">
            <img src="logo.jpg" class="logo-watermark" alt="Summitra">
            <div class="header-text-group">
                <div class="header-title">Summitra</div>
                <div class="header-subtitle">Reaching the Epitome of Wellness</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="secondary-btn logout-pill" onclick="location.href='dashboard.html'" title="Dashboard">
                <span class="material-symbols-rounded">dashboard</span>
            </button>
            <button class="secondary-btn logout-pill" onclick="location.href='analytics.html'" title="Analytics">
                <span class="material-symbols-rounded">insights</span>
            </button>
            <button class="secondary-btn logout-pill" onclick="location.href='live.html'" title="Live Monitor">
                <span class="material-symbols-rounded">sensors</span>
            </button>

            <div class="profile-container">
                <button class="profile-trigger" onclick="toggleDropdown()">
                    <span class="material-symbols-rounded">account_circle</span>
                    <span id="display-user">User</span>
                    <span class="material-symbols-rounded" style="font-size: 1.2rem;">expand_more</span>
                </button>

                <div id="profile-dropdown" class="dropdown-menu">
                    <div class="dropdown-header">
                        <span class="label">Authenticated As</span>
                        <div class="user-email" id="user-detail">user@summitra</div>
                    </div>

                    <hr class="dropdown-divider">

                    <div class="dropdown-header">
                        <span class="label">Summitra</span>
                    </div>
                    <button class="dropdown-item secondary-item" onclick="location.href='privacyPolicy.html'">
                        <span class="material-symbols-rounded">shield</span>
                        Our Policy
                    </button>
                    <button class="dropdown-item secondary-item" onclick="window.open('about.html', '_blank')">
                        <span class="material-symbols-rounded">info</span>
                        About Summitra
                    </button>

                    <hr class="dropdown-divider">

                    <div class="dropdown-header">
                        <span class="label">System</span>
                    </div>
                    <button class="dropdown-item" onclick="location.href='profile.html'">
                        <span class="material-symbols-rounded">person</span>
                        Your Profile
                    </button>
                    <button class="dropdown-item" onclick="logout()">
                        <span class="material-symbols-rounded">logout</span>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="chat-layout animate-fade-in-up">
        <div class="chat-container">
            <div class="chat-header-section">
                <div class="chat-header-icon animate-scale-in">
                    <span class="material-symbols-rounded">chat</span>
                </div>
                <div class="chat-header-info">
                    <h2>Mitraa AI Assistant</h2>
                    <p>Ask in-depth questions about your posture telemetry & habits</p>
                </div>
            </div>

            <div id="chat-messages" class="chat-messages">
                <!-- Messages will be injected here -->
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Type a message to Mitraa..." autocomplete="off">
                </div>
                <button id="send-btn" class="chat-send-btn">
                    <span class="material-symbols-rounded">send</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        let supabaseSession = null;
        let conversationHistory = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.summitraAuthReady) {
                supabaseSession = await window.summitraAuthReady;
            }

            appendMessage('bot', "Hello! I am Mitraa, your posture intelligence assistant. How can I help you analyze your posture telemetry today?");

            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);
        });

        function appendMessage(sender, text) {
            const messagesContainer = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender} animate-scale-in`;

            if (sender === 'bot') {
                msgDiv.innerHTML = marked.parse(text);
            } else {
                msgDiv.textContent = text;
            }

            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chat-messages');
            const indicator = document.createElement('div');
            indicator.id = 'typing-indicator';
            indicator.className = 'typing-indicator animate-scale-in';
            indicator.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;

            // Push to local conversation history
            conversationHistory.push({ role: "user", content: text });
            appendMessage('user', text);
            showTypingIndicator();

            try {
                if (!supabaseSession) {
                    const { data } = await _supabase.auth.getSession();
                    supabaseSession = data.session;
                }

                if (!supabaseSession) {
                    throw new Error("No authenticated session. Please log in again.");
                }

                const response = await fetch(
                    "https://gigpodszdjckhvpzmuuh.supabase.co/functions/v1/conversation-service",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${supabaseSession.access_token}`
                        },
                        body: JSON.stringify({
                            messages: conversationHistory
                        })
                    }
                );

                const rawResponse = await response.text();
                let data;
                try {
                    data = JSON.parse(rawResponse);
                } catch {
                    throw new Error(`Edge Function returned non-JSON response: ${rawResponse}`);
                }

                if (!response.ok) {
                    throw new Error(data?.error || `Edge Function failed with HTTP ${response.status}`);
                }

                removeTypingIndicator();
                const replyText = data.responseText || "No response received.";
                
                // Push response to history
                conversationHistory.push({ role: "assistant", content: replyText });
                appendMessage('bot', replyText);
            } catch (error) {
                removeTypingIndicator();
                appendMessage('bot', `**Error:** ${error.message}`);
                // Remove the failed user query from history to keep it clean
                conversationHistory.pop();
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
    // Auto-remove overlay after animation completes (4.4 seconds)
    setTimeout(() => {
        const overlay = document.getElementById('bot-welcome-overlay');
        if (overlay) overlay.remove();
    }, 4400);
});
    </script>
    <div id="summitra-help-root"></div>
    <script src="help-system.js" defer></script>
</body>

</html>
