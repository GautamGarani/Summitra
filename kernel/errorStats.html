<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Local Storage Viewer</title>

<style>
body {
    font-family: monospace;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
}

h1 {
    margin-bottom: 10px;
}

.section {
    margin-bottom: 30px;
}

.box {
    background: #020617;
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #1e293b;
}

button {
    margin-right: 10px;
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button.danger {
    background: #dc2626;
}
</style>
</head>

<body>

<h1>Local Storage Inspector</h1>

<div>
    <button onclick="loadStorage()">Refresh</button>
    <button class="danger" onclick="clearStorage()">Clear All</button>
</div>

<div class="section">
    <h2>Sessions</h2>
    <div id="sessions" class="box"></div>
</div>

<div class="section">
    <h2>Error Logs</h2>
    <div id="errors" class="box"></div>
</div>

<div class="section">
    <h2>All Keys (Raw)</h2>
    <div id="all" class="box"></div>
</div>

<script>

function pretty(data) {
    try {
        return JSON.stringify(data, null, 2);
    } catch {
        return String(data);
    }
}

// Load everything
function loadStorage() {
    const sessions = JSON.parse(localStorage.getItem("sessions")) || [];
    const errors = JSON.parse(localStorage.getItem("errorLogs")) || [];

    document.getElementById("sessions").textContent = pretty(sessions);
    document.getElementById("errors").textContent = pretty(errors);

    // Show ALL keys
    let allData = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        try {
            allData[key] = JSON.parse(localStorage.getItem(key));
        } catch {
            allData[key] = localStorage.getItem(key);
        }
    }

    document.getElementById("all").textContent = pretty(allData);
}

function clearStorage() {
    if (confirm("Are you sure you want to delete ALL local data?")) {
        localStorage.clear();
        loadStorage();
    }
}

loadStorage();

</script>

</body>
</html>
