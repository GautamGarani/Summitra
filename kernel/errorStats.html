<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        //AUTH GUARD GATEKEEPING
        (function () {
            const currentUserId = localStorage.getItem('currentUserId');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser');

            if (isLoggedIn !== 'true' || !currentUser) {
                // Optional: Clean any corrupted state
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
                localStorage.getItem('currentUserId');

                window.location.href = 'login.html';
            }
        })();
    </script>
    <script src="connectivity.js"></script>

    <link rel="icon" type="image/png" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summitra : Debug Console</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&family=JetBrains+Mono:wght@500&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        pre {
            margin: 0;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--blue-900);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Custom adjustment for the debug main container */
        .dashboard-main-pro {
            gap: 24px;
            padding: 40px;
        }

        body {
            overflow-x: hidden;
            background-color: var(--surface);
        }

        .entrance-container {
            perspective: 2000px;
            padding-bottom: 100px;
        }

        .swirl-in {
            opacity: 0;
            transform-origin: center center;
            animation: entranceSwirl 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes entranceSwirl {
            0% {
                opacity: 0;
                transform: rotateX(-20deg) rotateY(15deg) scale(0.9) translateY(60px);
                filter: blur(10px);
            }

            100% {
                opacity: 1;
                transform: rotateX(0deg) rotateY(0deg) scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .fancy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-soft);
        }

        .header-title {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--blue-900);
            letter-spacing: -0.5px;
        }

        /* Hero Section */
        .policy-hero {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 4rem;
            align-items: center;
            padding: 80px 4rem !important;
        }

        .hero-stock-img {
            width: 100%;
            border-radius: 32px;
            transform: perspective(1000px) rotateY(-15deg) rotateX(5deg);
            box-shadow: -30px 30px 60px rgba(13, 27, 42, 0.15);
            transition: transform 0.6s ease;
        }

        .hero-stock-img:hover {
            transform: perspective(1000px) rotateY(0deg) rotateX(0deg) scale(1.02);
        }

        /* Feature Grid Adjustments */
        .feature-grid {
            padding: 0 4rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .zoom-hover-card {
            display: flex;
            flex-direction: column;
            padding: 3rem;
            border-radius: 32px;
            background: white;
            border: 1px solid var(--border-soft);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
        }

        .zoom-hover-card:hover {
            transform: scale(1.02) translateY(-10px);
            box-shadow: 0 40px 80px rgba(13, 27, 42, 0.08);
            border-color: var(--blue-primary);
        }

        .feature-badge {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            background: var(--blue-accent);
            color: var(--blue-primary);
        }

        .feature-points {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-points div {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            color: var(--blue-700);
        }

        .feature-points div::before {
            content: "check_circle";
            font-family: 'Material Symbols Rounded';
            color: var(--success);
            font-size: 20px;
        }

        .btn-container {
            margin-top: 4rem;
            text-align: center;
        }

        /* =========================
   MOBILE RESPONSIVENESS
   ========================= */

        @media (max-width: 768px) {

            /* Global */
            body {
                font-size: 14px;
            }

            /* Header */
            .fancy-header {
                padding: 1rem 1.2rem;
                flex-direction: row;
                gap: 0.5rem;
            }

            .header-title {
                font-size: 1.1rem;
            }

            .header-subtitle {
                display: none;
            }

            /* Profile dropdown trigger shrink */
            .profile-trigger span:nth-child(2) {
                display: none;
                /* hide username for space */
            }

            /* Hero Section */
            .dashboard-hero {
                padding: 40px 1.2rem !important;
                text-align: left;
            }

            .gemini-greet {
                font-size: 1.8rem;
            }

            .hero-pills {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .metric-pill {
                font-size: 0.75rem;
                padding: 0.4rem 0.8rem;
            }

            /* Grid → Stack */
            .feature-grid {
                grid-template-columns: 1fr;
                padding: 0 1rem;
                /* Give it a little more breathing room */
                width: 100%;
                box-sizing: border-box;
            }

            /* Cards */
            .card,
            .feature-card,
            .zoom-hover-card {
                width: 100%;
                box-sizing: border-box;
                padding: 1.5rem !important;
                margin: 0 0 1rem 0;
                border-radius: 20px;
                overflow: hidden;
            }

            .feature-badge {
                width: 52px;
                height: 52px;
                margin-bottom: 1rem;
            }

            .entrance-container {
                overflow-x: hidden;
                width: 100%;
            }

            .feature-card h2 {
                font-size: 1.2rem;
            }

            .feature-card p {
                font-size: 0.9rem;
            }

            /* Buttons full width */
            .btn {
                width: 100%;
                justify-content: center;
            }

            /* TABLE FIX (CRITICAL) */
            .manifest-table-container {
                overflow-x: auto;
            }

            .manifest-light-table {
                min-width: 600px;
                /* allows horizontal scroll */
                font-size: 0.8rem;
            }

            /* Reduce spacing */
            .btn-container {
                margin-top: 2rem;
            }
        }


        /* Extra small devices */
        @media (max-width: 480px) {

            .gemini-greet {
                font-size: 1.5rem;
            }

            .metric-pill {
                font-size: 0.7rem;
            }

            .feature-card h2 {
                font-size: 1.05rem;
            }
        }

    </style>
</head>

<body>

    <header class="fancy-header">
        <div class="header-content">
            <img src="logo.jpg" class="logo-watermark" alt="Summitra">
            <!-- Grouped branding text stays horizontally aligned with the logo -->
            <div class="header-text-group">
                <div class="header-title">Summitra</div>
                <div class="header-subtitle">Reaching the Epitome of Wellness</div>
            </div>
        </div>

        <div class="header-actions">
            <button class="secondary-btn logout-pill" onclick="location.href='dashboard.html'">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <button class="secondary-btn logout-pill" onclick="loadStorage()">
                <span class="material-symbols-rounded">refresh</span>
            </button>
            <!-- Profile container with absolute positioning for the menu -->
            <div class="profile-container">
                <button class="profile-trigger" onclick="toggleDropdown()">
                    <span class="material-symbols-rounded">account_circle</span>
                    <!-- display-user will now show the human-readable Display Name -->
                    <span id="display-user">User</span>
                    <span class="material-symbols-rounded" style="font-size: 1.2rem;">expand_more</span>
                </button>

                <div id="profile-dropdown" class="dropdown-menu">
                    <!-- Section 1: Identity -->
                    <div class="dropdown-header">
                        <span class="label">Authenticated As</span>
                        <div class="user-email" id="user-detail">user@summitra</div>
                    </div>

                    <hr class="dropdown-divider">

                    <!-- Section 2: Account Settings -->
                    <div class="dropdown-header">
                        <span class="label">Summitra</span>
                    </div>
                    <button class="dropdown-item secondary-item" onclick="window.open('privacyPolicy.html', '_blank')">
                        <span class="material-symbols-rounded">shield</span>
                        Our Policy
                    </button>
                    <button class="dropdown-item secondary-item" onclick="window.open('about.html', '_blank')">
                        <span class="material-symbols-rounded">info</span>
                        About Summitra
                    </button>

                    <hr class="dropdown-divider">

                    <div class="dropdown-header">
                        <span class="label">System</span>
                    </div>
                    <button class="dropdown-item" onclick="location.href='profile.html'">
                        <span class="material-symbols-rounded">person</span>
                        Your Profile
                    </button>
                    <button class="dropdown-item" onclick="logout()">
                        <span class="material-symbols-rounded">logout</span>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="dashboard-main-pro">

        <!--<div class="card feature-card" style="flex-direction: row; gap: 16px; padding: 24px; align-items: center;">
            <button class="btn" style="width: auto;" onclick="loadStorage()">
                <span class="material-symbols-rounded">refresh</span> Refresh
            </button>
        </div>-->

        <div class="feature-grid">
            <!-- Targeted user-specific telemetry -->
            <div class="card feature-card">
                <div class="feature-badge"><span class="material-symbols-rounded">database</span></div>
                <h2>Session Manifest</h2>
                <div class="stats-table-dark-wrapper2">
                    <pre id="sessions">Loading manifest...</pre>
                </div>
            </div>

            <div class="card feature-card">
                <div class="feature-badge" style="background:#FEE2E2; color:#B91C1C;"><span
                        class="material-symbols-rounded">bug_report</span></div>
                <h2>Console Logs</h2>
                <div class="stats-table-dark-wrapper2">
                    <pre id="errors">No errors detected.</pre>
                </div>
            </div>
        </div>

        <!-- ALL STORAGE-->
        <div class="card feature-card">
            <h2>Global Raw Data</h2>
            <div class="stats-table-dark-wrapper2" style="max-height: 400px;">
                <pre id="all"></pre>
            </div>
        </div>

    </main>

    <script>

        function pretty(data) {
            try {
                return JSON.stringify(data, null, 2);
            } catch {
                return String(data);
            }
        }

        function loadStorage() {
            const currentUser = localStorage.getItem('currentUser');
            const allSessions = JSON.parse(localStorage.getItem("sessions")) || [];
            const errors = JSON.parse(localStorage.getItem("errorLogs")) || [];

            // Filter sessions exclusively for THIS user
            const userSessions = allSessions.filter(s => s.owner === currentUser);

            document.getElementById("sessions").textContent = pretty(userSessions);
            document.getElementById("errors").textContent = pretty(errors);

            let allData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    allData[key] = JSON.parse(localStorage.getItem(key));
                } catch {
                    allData[key] = localStorage.getItem(key);
                }
            }
            document.getElementById("all").textContent = pretty(allData);
        }

        loadStorage();
    </script>

    <script src="auth.js"></script>
    <div id="summitra-help-root"></div>
    <script src="help-system.js" defer></script>
</body>

</html>
